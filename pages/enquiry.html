              <p>Please fill in the form below to make an enquiry.</p>

                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required><br/><br/>
                <label for="email">Email</label>

                <label for="type_of_equiry" name="type_of_equiry">Type of Enquiry:</label>

                    <option value="">General Enquiry</option>
                    <option value="event_booking">Event Booking</option>
                    <option value="feedback">Feedback about previous enquiry</option>
                </select><br/><br/>
                <label for="message">Message:</label><br/>
                <textarea id="message" name="message" rows="4" cols="50" placeholder="Enter your description for your enquiry here..." required></textarea><br/><br/>
                <button type="submit">Submit</button>


              </form>
